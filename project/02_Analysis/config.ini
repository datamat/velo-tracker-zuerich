; Velo Tracker Zürich – settings. Change values here, never in the scripts.

[paths]
; where all downloaded data goes (raw files, dated snapshots).
; Always on the D: drive under D:\nfa_data\4_projects – never C:, the Synology (N:) or the project folder.
; The scripts refuse any other folder.
data_dir = D:\nfa_data\4_projects\velo_map

[download]
; counter values: first year to fetch (data exists from 2009)
counter_first_year = 2015
; re-download a file when it is older than this many days
max_age_days = 6
; counter and accident files of past years never change: keep them once downloaded
keep_past_years = yes

[map]
; accident hex size: distance across the hexagon in metres
hex_width_m = 150
; first accident year shown (data exists from 2011)
accident_first_year = 2011
; network layer field that holds the status (empty = detect automatically)
network_status_field =

[targets]
; Velovorzugsrouten target, from the city page (see official_figures.csv)
network_km = 130
initiative_km = 50
target_year = 2031
